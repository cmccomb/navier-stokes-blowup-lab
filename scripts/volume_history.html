<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full saved 3D history from rest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07111f;color:#e9f1f5;font:16px Arial,Helvetica,sans-serif}
main{padding:18px 18px 0;max-width:1400px;margin:auto}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.45;margin:8px 0;color:#b8c8d5}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
button,select{font:inherit;color:inherit;background:#14263b;border:1px solid #63778c;border-radius:5px;padding:8px 12px;min-height:40px}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid #f5ce75;outline-offset:3px}
.timeline{display:flex;align-items:center;gap:10px;margin-top:12px}.timeline input{width:100%;min-width:0;accent-color:#f5ce75;height:30px}
#position{font-variant-numeric:tabular-nums;margin-top:10px}#status{min-height:21px}#status.error{color:#ffcf91}
#stream-volume{height:560px;width:100%}.modebar{top:0!important}[hidden]{display:none!important}
@media(max-width:560px){main{padding:14px 12px 0}.controls{gap:8px}button,select{padding:7px 10px}#stream-volume{height:440px}}
</style></head><body><main>
<h1 id="title">3D from rest</h1><p id="sampling"></p>
<div class="controls"><button id="play" disabled>Play</button><button id="first" disabled>First</button><button id="last" disabled>Latest</button>
<label for="component">Show</label><select id="component"><option value="magnitude">Magnitude</option><option value="x">x component</option><option value="y">y component</option><option value="z">z component</option></select></div>
<div class="timeline"><label for="timeline">Frame</label><input id="timeline" type="range" min="0" value="0" step="1" disabled></div>
<div id="position">No frame loaded yet</div><p id="status" role="status" aria-live="polite">Loading initial rest state…</p><button id="retry" hidden>Retry selected frame</button>
<div id="stream-volume" aria-label="Rotatable three-dimensional saved vector field"></div>
<p>Every saved snapshot, from rest. Playback waits for each frame; saved times are nonuniform, with no interpolation. Color scales are fixed over this published history. Arrows show all three signed vector components.</p>
</main><script id="volume-history" type="application/json">__HISTORY__</script>
<script>__PLOTLY__</script><script>__VIEWER__</script></body></html>
