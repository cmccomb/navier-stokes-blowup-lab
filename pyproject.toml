[project]
name = "navier-stokes-singularity-simulation"
version = "0.7.0"
description = "Independent, proof-informed 3D CFD experiments for a Navier-Stokes blow-up construction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "phiflow==3.4.0",
  "plotly>=6.0",
  "scikit-image>=0.24",
  "scipy>=1.12",
]

[project.scripts]
ns-blowup = "navier_stokes_sim.cli:main"
ns-fidelity = "navier_stokes_sim.fidelity:main"
ns-frontier = "navier_stokes_sim.frontier:main"
ns-study = "navier_stokes_sim.study:main"
ns-validation = "navier_stokes_sim.validation:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/navier_stokes_sim/{plotting,study,validation}.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navier_stokes_sim"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
